# custock as one container on a shared server, behind the reverse proxy that is already there.
# from this folder: docker compose -f compose.server.yml up -d --build   (needs .env, see env.example)

services:
  custock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CUSTOCK_BASE_PATH: ${CUSTOCK_BASE_PATH:-/custock}
    image: custock
    container_name: custock
    restart: unless-stopped
    env_file: .env
    volumes:
      - custock-data:/data
    # localhost only, the reverse proxy is the way in
    ports:
      - "127.0.0.1:${CUSTOCK_WEB_PORT:-3090}:3000"
      - "127.0.0.1:${CUSTOCK_API_PORT:-8790}:8787"
    mem_limit: 768m

volumes:
  custock-data:
