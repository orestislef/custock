# custock as one container on a shared server, behind the reverse proxy that is already there.
# the image is built on the server by deploy/ship.sh, so the server keeps no source code.
# lives on the server as /opt/custock/compose.yml, next to its .env (see env.example).

name: custock

services:
  custock:
    image: custock:latest
    container_name: custock
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    # localhost only, the reverse proxy is the way in
    ports:
      - "127.0.0.1:${CUSTOCK_WEB_PORT:-3090}:3000"
      - "127.0.0.1:${CUSTOCK_API_PORT:-8790}:8787"
    mem_limit: 768m

volumes:
  data:
