# custock on one server: the api, the web and litestream backing up the database.
# run from this folder: docker compose up -d   (cp env.example .env and fill it in first)

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: custock-api
    restart: unless-stopped
    env_file: .env
    environment:
      CUSTOCK_DB: /data/custock.db
      CUSTOCK_UPLOAD_DIR: /data/uploads
    volumes:
      - custock-data:/data
    ports:
      - "127.0.0.1:8787:8787"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        CUSTOCK_API_URL: http://api:8787
    image: custock-web
    restart: unless-stopped
    environment:
      CUSTOCK_API_URL: http://api:8787
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - custock-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - api

volumes:
  custock-data:
